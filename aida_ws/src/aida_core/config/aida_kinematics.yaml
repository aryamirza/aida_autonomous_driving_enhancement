# aida_kinematics.yaml
# Hardware constraints and tuning parameters for AIDA

/**:
  ros__parameters:
    # Hardware Constraints (Locked for MentorPi A1)
    wheelbase: 0.14
    track_width: 0.145
    wheel_width: 0.025
    wheel_radius: 0.0325
    wheel_width: 0.025

    # --- STAGE A: VIDAR / CAMERA SYSTEM ---
    # Static Base Offsets (X=Forward, Z=Up)
    camera_pivot_offset_x: -0.01   # 1cm behind front axle
    camera_pivot_z: 0.085          
    lidar_offset_x: -0.085         # Behind front axle
    
    # Moving Link Lengths (Dynamic Pan-Tilt)
    link_pan_to_tilt: 0.04         
    link_tilt_to_lens: 0.06        
    
    # Camera Specs
    camera_fov: 1.39               

    # --- STAGE B: IMPACT VERIFIER (IMU) ---
    window_size: 64
    impact_threshold_fixed: 2.5    
    impact_threshold_dynamic_n_sigma: 3.0

aida_vidar_node:
  ros__parameters:
    # Hardware Constraints
    wheelbase: 0.14
    track_width_front: 0.14
    track_width_rear: 0.145

    # Camera Pivot and Link Distances
    camera_pivot_offset_x: -0.01
    camera_pivot_z: 0.085
    lidar_offset_x: -0.085
    link_pan_to_tilt: 0.04
    link_tilt_to_lens: 0.06
    camera_fov: 1.39
